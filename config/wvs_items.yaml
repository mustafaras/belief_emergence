version: 2.0
description: >
  WVS item mapping for belief-emergence constructs Z, C, D, S.
  Harmonized across waves 3–7 for Q1-journal–level reproducibility.
  This configuration file is the canonical machine-readable specification
  for ETL scripts in scripts/01_wvs_measurement/.
  See docs/variable_definitions.md for conceptual definitions and
  docs/wvs_item_mapping.md for detailed item-level documentation.

metadata:
  last_updated: "2025-12-02"
  maintainer: "Belief Emergence Research Team"
  related_documentation:
    - "docs/variable_definitions.md"
    - "docs/wvs_item_mapping.md"
  waves_covered: [3, 4, 5, 6, 7]
  wave_years:
    3: "1995-1998"
    4: "1999-2004"
    5: "2005-2009"
    6: "2010-2014"
    7: "2017-2022"

defaults:
  normalisation: "zscore"
  missing_codes: [-1, -2, -3, -4, -5, 98, 99, 999]
  aggregation_method: "mean"  # country-wave means
  min_observations: 30  # minimum individual obs per country-wave to compute mean
  min_item_coverage: 0.5  # minimum fraction of items available to compute construct index

constructs:
  Z_belief_outcome:
    label: "Belief outcome"
    description: "Composite index of religious/metaphysical belief intensity capturing salience, behavior, and transcendent commitment."

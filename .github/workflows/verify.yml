name: Verify

# Two independent jobs:
#   verify-app      exercises the analysis pipeline and the manuscript checkers
#   build-paper     compiles the manuscript and the supplement with a full TeX
#                   installation, which the development machine does not have
#
# The second job exists because the local TeX tree is missing biblatex,
# csquotes, placeins and xurl. Without this workflow the manuscript is never
# proven to compile, and a source that does not build is not a source.

on:
  push:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'config/**'
      - 'public/data/**'
      - 'paper/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'config/**'
      - 'public/data/**'
      - 'paper/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/verify.yml'
  workflow_dispatch:

jobs:
  verify-app:
    name: Analysis pipeline and manuscript checkers
    runs-on: ubuntu-latest
    # The repository root is the application; there is no BE_app/ subdirectory
    # in version control (that name only exists in the local development tree).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm run test:run

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Generate canonical analysis artefacts
        run: npm run generate:analysis

      - name: Generate headline metrics
        run: npm run generate:headline-metrics

      - name: Generate phase-1 validation artefacts
        run: npm run generate:phase1-validation

      - name: Generate repeated grouped k-fold validation (primary OOS evidence)
        run: npm run generate:kfold

      - name: Generate functional-form comparison (linear baseline)
        run: npm run generate:functional-form

      - name: Generate collinearity diagnostics
        run: npm run generate:collinearity

      - name: Generate collinearity ablation
        run: npm run generate:collinearity-ablation

      - name: Generate zero-fill sensitivity
        run: npm run generate:zero-fill

      - name: Generate construct prevalence summary
        run: npm run generate:prevalence

      - name: Regenerate evaluation figures from artifacts
        run: |
          pip install --quiet matplotlib
          npm run generate:figures
          cp paper/main/fig_eval_pair.pdf paper/supplementary/fig_eval_pair.pdf

      - name: Check manuscript numeric consistency
        run: npm run check:manuscript-consistency

      - name: Check section references
        run: npm run check:section-references

      - name: Verify construct audit against item-level data (skips when absent)
        run: npm run verify:constructs

      - name: Deterministic reproducibility gate
        run: npm run ci:gate

      - name: Q1 submission gate
        run: npm run q1:gate

  build-paper:
    name: Compile manuscript and supplement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile main manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper/main
          # main.tex uses biblatex with the biber backend.
          latexmk_use_lualatex: false

      - name: Compile supplementary materials
        uses: xu-cheng/latex-action@v3
        with:
          root_file: supplementary_materials.tex
          working_directory: paper/supplementary

      # The submission bundle. These three files had never been compiled: the
      # workflow only built the manuscript and the supplement, so a broken
      # cover letter or title page would have reached the portal unseen.
      - name: Compile cover letter
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cover_letter.tex
          working_directory: paper

      - name: Compile highlights
        uses: xu-cheng/latex-action@v3
        with:
          root_file: highlights.tex
          working_directory: paper

      - name: Compile title page
        uses: xu-cheng/latex-action@v3
        with:
          root_file: titlepage.tex
          working_directory: paper

      - name: Assemble submission bundle
        run: |
          mkdir -p submission
          cp paper/main/main.pdf                       submission/01_manuscript.pdf
          cp paper/supplementary/supplementary_materials.pdf submission/02_supplementary.pdf
          cp paper/titlepage.pdf                       submission/03_title_page.pdf
          cp paper/cover_letter.pdf                    submission/04_cover_letter.pdf
          cp paper/highlights.pdf                      submission/05_highlights.pdf
          ls -lh submission

      - name: Upload compiled PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-pdfs
          path: |
            paper/main/main.pdf
            paper/supplementary/supplementary_materials.pdf
            paper/titlepage.pdf
            paper/cover_letter.pdf
            paper/highlights.pdf
            submission/
          if-no-files-found: warn
